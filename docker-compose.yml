services:
  backend:
    build:
      context: ./backend
    environment:
      API_KEY: ${API_KEY:-dev-api-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_KEY: ${API_KEY:-dev-api-key}
    ports:
      - "5173:5173"
    depends_on:
      - backend
